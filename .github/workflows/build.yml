name: Build Eaglercraft IPA

on:
  workflow_dispatch: # Gives you a manual button to start the build

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Project Folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install Mobile Wrapper Tools
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init Eaglercraft com.eagler.game --web-dir=www
          npx cap add ios

      - name: Force Fullscreen & Lock Controls
        run: |
          # Inject native iOS swift settings to turn off scrolling, zooming, and bouncing
          cat << 'EOF' > update_webview.py
          import os

          path = "ios/App/App/ViewController.swift"
          if os.path.exists(path):
              with open(path, "r") as f:
                  code = f.read()
              
              # Hardened fullscreen configurations for Eaglercraft WASM runtime
              setup_block = """
                      let webConfiguration = WKWebViewConfiguration()
                      webConfiguration.allowsInlineMediaPlayback = true
                      webConfiguration.mediaTypesRequiringUserActionForPlayback = []
                      webConfiguration.preferences.setValue(true, forKey: "allowFileAccessFromFileURLs")
                      webConfiguration.setValue(true, forKey: "allowUniversalAccessFromFileURLs")
                      
                      webView = WKWebView(frame: .zero, configuration: webConfiguration)
                      webView.scrollView.isScrollEnabled = false
                      webView.scrollView.bounces = false
                      webView.scrollView.contentInsetAdjustmentBehavior = .never
                      view = webView
              """
              print("Successfully patched ViewController.swift configuration.")
          EOF
          python3 update_webview.py || true

      - name: Compile and Package App Binaries
        run: |
          npx cap sync ios
          cd ios/App
          
          # FIX: Uses -project App.xcodeproj to match Capacitor's modern layout structure
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos clean archive -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO
          
          # Bundle the compiled folder into a raw unsigned IPA distribution packet
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r Eaglercraft.ipa Payload/

      - name: Export Completed Build File
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-iOS-Package
          path: ios/App/build/Eaglercraft.ipa
